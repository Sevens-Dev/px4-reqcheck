name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src/px4reqcheck/requirements src/px4reqcheck/params src/px4reqcheck/cli.py
      - run: uv run pytest
      - name: Audit Python dependencies
        shell: bash
        run: |
          set -o pipefail
          uv export --format requirements-txt --no-hashes | uv run pip-audit -r /dev/stdin

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++17 checker
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - name: Build with warnings as errors
        run: cmake --build cpp/build --parallel 2
      - name: Run GoogleTest suite
        run: ctest --test-dir cpp/build --output-on-failure

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
