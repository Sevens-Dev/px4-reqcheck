name: Real corpus reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups --locked
      - name: Download the checksum-pinned corpus
        run: make corpus
      - name: Normalize the corpus
        run: make ingest
      - name: Run the complete quality and report gate
        run: make all
      - name: Verify the committed report is byte-for-byte reproducible
        run: git diff --exit-code -- docs/report
      - uses: actions/upload-artifact@v4
        with:
          name: real-corpus-report
          path: docs/report/
          if-no-files-found: error
          retention-days: 30
